version: 5
project:
  name: DD2 Cell Finder
  group: GB4
  option: 2
  ai_mode: development aid
source:
  src/dd2: M1 and shared Option 2 checks
  src/dd2m2: M2 ranking and M3 mapping workflow
  tests: active tests and frozen negative cases
commands:
  setup: link external inputs and install Python dependencies
  check: verify the toolchain and input libraries
  test: exercise the Option 2 checks
  all: rebuild M1, M2 and the complete M3 experiment
  reproduce: rerun the real experiment from the recorded selection
  demo: run the Option 2 workflow for an unseen design
evidence:
  m1: results/m1
  m2: results/m2
  m2_review: TA_M2
  m3: results/m3
  generator_responses: libs/cellweaver
  ai_report: report/ai_report.pdf
  ai_records: ai
external_inputs:
  - given
  - pdk
  - tutorials
archive: others

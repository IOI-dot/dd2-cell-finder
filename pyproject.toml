[project]
name = "dd2"
version = "0.1.0"
description = "DD2 Project 1, Option 2: find functions worth adding to SKY130 HD and measure custom-cell savings"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd2", "src/dd2m2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

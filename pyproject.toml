[project]
name = "dd2"
version = "0.1.0"
description = "DD2 Project 1 (Option 3): find repeated Boolean functions missing from SKY130 HD"
requires-python = ">=3.11"
dependencies = []  # the M1 core is standard library only (research D-1)

[project.optional-dependencies]
dev = ["pytest>=8"]
# Canonical Table 1 Yosys (research D-2); install verification is task T004.
flow = ["yowasp-yosys==0.33.0.0.post574"]
agent = ["langgraph>=1,<2", "langchain>=1.2", "ag-ui-langgraph==0.0.47", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

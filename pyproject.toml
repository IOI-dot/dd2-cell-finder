[project]
name = "dd2"
version = "0.1.0"
description = "DD2 Project 1, Option 3: find functions worth adding to SKY130 HD (Option 2) and build them as verified cells (Option 1)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Option 1 (cellgen): layout with GDSfactory, geometry checks with KLayout (pinned after the cp1 run).
cell = ["gdsfactory==9.51.0"]
agent = ["langgraph>=1,<2"]
web = ["langchain>=1.2", "ag-ui-langgraph==0.0.47", "fastapi>=0.115"]  # the AG-UI server
voice = ["onnx-asr[cpu]>=0.12,<0.13"]  # Parakeet speech to text for the web app's mic

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd2", "src/dd2m2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
